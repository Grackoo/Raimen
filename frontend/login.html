<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAIMEN POS - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>RAIMEN - Acceso</h1>
    </header>
    <main style="display:flex; justify-content:center; align-items:center; height:80vh;">
        <div style="border:1px solid #ccc; padding:20px; border-radius:8px; width:300px;">
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <input type="text" id="username" placeholder="Usuario" required style="width:100%; margin-bottom:10px;">
                <input type="password" id="password" placeholder="Contraseña" required style="width:100%; margin-bottom:10px;">
                <select id="role" style="width:100%; margin-bottom:10px;">
                    <option value="cashier">Cajero</option>
                    <option value="admin">Administrador</option>
                </select>
                <select id="branch" style="width:100%; margin-bottom:10px;">
                    <option value="sucursal_centro">Sucursal Centro</option>
                    <option value="sucursal_norte">Sucursal Norte</option>
                </select>
                <button type="submit" style="width:100%;">Ingresar</button>
            </form>
        </div>
    </main>
    <script>
        document.getElementById('role').addEventListener('change', (e) => {
            document.getElementById('branch').style.display = e.target.value === 'admin' ? 'none' : 'block';
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const branch = role === 'admin' ? 'global' : document.getElementById('branch').value;
            const session = {
                username: document.getElementById('username').value,
                role: role,
                branch: branch,
                hasActiveShift: role === 'admin' ? true : confirm("¿Tiene la cajera un turno activo en cash_shifts? (Aceptar = Sí)")
            };
            localStorage.setItem('raimen_session', JSON.stringify(session));
            window.location.href = role === 'admin' ? 'admin.html' : 'index.html';
        });
    </script>
</body>
</html>
