<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAIMEN POS</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bwip-js/3.4.1/bwip-js-min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <header>
        <h1>RAIMEN POS</h1>
        <div id="shift-status">Verificando turno...</div>
    </header>

    <nav>
        <button onclick="app.showView('pos')">Venta</button>
        <button onclick="app.showView('inventory')">Inventario</button>
    </nav>

    <main>
        <!-- POS View -->
        <section id="pos-view" class="view active">
            <h2>Punto de Venta</h2>
            <div id="reader-container" style="display:none;">
                <div id="reader"></div>
                <button onclick="scanner.stopScan()" style="background-color: #dc3545;">Cancelar Escaneo</button>
            </div>
            <button onclick="scanner.startScan()">Escanear Artículo</button>
            <div id="cart">
                <h3>Carrito</h3>
                <ul id="cart-items"></ul>
                <p>Total: $<span id="cart-total">0.00</span></p>
                <button onclick="printer.printReceipt()" style="background-color: #28a745;">Cobrar e Imprimir Ticket</button>
            </div>
        </section>

        <!-- Inventory View -->
        <section id="inventory-view" class="view" style="display:none;">
            <h2>CRUD Artículos</h2>
            <form id="item-form" onsubmit="inventory.saveItem(event)">
                <input type="text" id="item-name" placeholder="Nombre del artículo" required>
                <input type="number" id="item-price" placeholder="Precio" step="0.01" required>
                <input type="text" id="item-barcode" placeholder="Código (vacío = autogenerar)">
                <button type="submit">Guardar Artículo</button>
            </form>
            <div class="canvas-container">
                <canvas id="barcode-canvas"></canvas>
            </div>
            <ul id="inventory-list"></ul>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/printer.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
