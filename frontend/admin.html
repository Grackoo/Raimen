<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAIMEN POS - Admin Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>RAIMEN ADMIN (Vista Global)</h1>
        <div>Usuario: <span id="admin-name"></span> | <a href="#" onclick="logout()">Cerrar sesión</a></div>
    </header>
    <nav>
        <button onclick="showView('branches')">Gestionar Sucursales</button>
        <button onclick="showView('cashiers')">Gestionar Cajeros</button>
        <button onclick="window.location.href='dashboard.html'">Inteligencia Comercial (ROI & Tickets)</button>
        <button onclick="window.location.href='index.html'">Ir al POS</button>
    </nav>
    <main>
        <section id="branches-view" class="view active">
            <h2>Sucursales (Global)</h2>
            <ul id="branch-list">
                <li>Sucursal Centro <button>Editar</button></li>
                <li>Sucursal Norte <button>Editar</button></li>
            </ul>
        </section>
        <section id="cashiers-view" class="view" style="display:none;">
            <h2>Cajeros</h2>
            <ul id="cashier-list">
                <li>Cajero 1 - Sucursal Centro <button>Editar</button></li>
                <li>Cajero 2 - Sucursal Norte <button>Editar</button></li>
            </ul>
        </section>
    </main>
    <script>
        function checkAuth() {
            const session = JSON.parse(localStorage.getItem('raimen_session'));
            if (!session || session.role !== 'admin') {
                alert('Acceso denegado. Se requiere vista global (Admin).');
                window.location.href = 'login.html';
            }
            document.getElementById('admin-name').textContent = session.username;
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
            document.getElementById(`${viewId}-view`).style.display = 'block';
        }

        function logout() {
            localStorage.removeItem('raimen_session');
            window.location.href = 'login.html';
        }

        window.onload = checkAuth;
    </script>
</body>
</html>
